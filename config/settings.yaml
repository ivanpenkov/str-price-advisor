property:
  name: "Villa del Sol"
  address: "920 E Carver Rd, Tempe, AZ 85284"
  kivoya_unit_id: 503802
  airbnb_room_id: "573857947793833342"
  bedrooms: 6
  bathrooms: 5
  max_guests: 16
  cleaning_fee: 500
  min_nights_default: 2

strategy:
  base_percentile: 65
  bayesian_shrinkage_k: 5.0
  min_empirical_sample_size: 5
  enforce_monotonic_tapering: true

  # Absolute Operational Price Floors (Dollar rates per night)
  operational_floors:
    weekend: 450.0
    midweek: 300.0

  # 2D Strategy Matrix (Horizon x Stay Type)
  lead_time_matrix:
    ">90d":
      description: "Early booking window with high willingness-to-pay. Anchor at premium percentiles."
      weekend:
        target: 67.5
        floor: 65.0
        p75: 75.0
      midweek:
        target: 47.5
        floor: 45.0
        p75: 55.0
      action_guidance: "Hold firm at 65%–70% (Weekend) / 45%–50% (Midweek). Strategic floor protects far-out luxury yield against early underpriced bargain hunters."

    "31–90d":
      description: "Prime conversion period for family vacations and luxury group travel."
      weekend:
        target: 62.5
        floor: 60.0
        p75: 70.0
      midweek:
        target: 32.5
        floor: 30.0
        p75: 45.0
      action_guidance: "Target 60%–65% (Weekend) / 30%–35% (Midweek). Aligned with empirical comp conversion band and protected by $300 midweek floor."

    "15–30d":
      description: "Demand curve compresses and price elasticity rises rapidly."
      weekend:
        target: 52.5
        floor: 50.0
        p75: 60.0
      midweek:
        target: 32.5
        floor: 30.0
        p75: 40.0
      action_guidance: "Trim to 50%–55% (Weekend) / 30%–32% (Midweek). Monotonic tapering prevents small-sample near-term spikes."

    "≤14d":
      description: "Distress inventory liquidation window where unbooked nights risk total perishable loss."
      weekend:
        target: 42.5
        floor: 40.0
        p75: 50.0
      midweek:
        target: 30.0
        floor: 28.0
        p75: 38.0
      action_guidance: "Aggressive liquidation: 40%–45% (Weekend) / 28%–32% (Midweek) to secure occupancy above $300 operational floor."

  anomaly_thresholds:
    urgent_percent_diff: 25.0  # >25% discrepancy triggers weekly urgent action
    urgent_lead_days: 60       # Unbooked dates <60 days away get elevated priority
    moderate_percent_diff: 10.0 # 10-25% discrepancy for monthly adjustment
  proposed_pricing:
    comp_weight: 0.67          # Double weight for comp-derived price (target percentile)
    historical_weight: 0.33    # Single weight for historical benchmark price
    weekend_premium_factor: 1.50 # Allocation factor for mixed stays
    min_price_change_pct: 0.05 # 5% deadband threshold: hold current price if proposed change is < 5% to prevent PMS churn

market:
  location: "Tempe, AZ"
  target_radius_miles: 20
  target_drive_min: 30
  corridors:
    - "South Tempe"
    - "Chandler"
    - "Gilbert"
    - "Ahwatukee"
    - "Scottsdale / Old Town corridor"
    - "Arcadia / East Phoenix"
  comp_tiers:
    tier_a:
      description: "Direct luxury comps: 16+ guests, 6+ bedrooms, pool, resort amenities"
      min_guests: 16
      min_bedrooms: 6
    tier_b:
      description: "Secondary comps: 12-15 guests, 5+ bedrooms, pool, luxury compound"
      min_guests: 12
      min_bedrooms: 5
