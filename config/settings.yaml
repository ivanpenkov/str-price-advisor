property:
  name: "Villa del Sol"
  address: "920 E Carver Rd, Tempe, AZ 85284"
  kivoya_unit_id: 503802
  airbnb_room_id: "573857947793833342"
  bedrooms: 6
  bathrooms: 5
  max_guests: 16
  cleaning_fee: 500
  min_nights_default: 2

strategy:
  base_percentile: 65
  bayesian_shrinkage_k: 5.0
  min_empirical_sample_size: 5
  enforce_monotonic_tapering: true

  # Absolute Operational Price Floors (Dollar rates per night)
  operational_floors:
    weekend: 450.0
    midweek: 300.0

  # 2D Strategy Matrix (Horizon x Stay Type)
  lead_time_matrix:
    ">180d":
      description: "Ultra-advance booking window (>180d). Captures high-value planners and prevents early luxury bargain hunting."
      weekend:
        target: 75.0
        floor: 70.0
        p75: 80.0
      midweek:
        target: 50.0
        floor: 45.0
        p75: 60.0
      action_guidance: "Hold firm at 75% (Weekend) / 50% (Midweek). Premium anchor protects far-out luxury yield against early underpriced bargain hunters."

    "91–180d":
      description: "Early booking window (91–180d) with high willingness-to-pay. Anchor at premium percentiles."
      weekend:
        target: 65.0
        floor: 60.0
        p75: 75.0
      midweek:
        target: 45.0
        floor: 40.0
        p75: 55.0
      action_guidance: "Hold firm at 60%–65% (Weekend) / 40%–45% (Midweek). Strategic floor protects far-out luxury yield against early underpriced bargain hunters."

    "31–90d":
      description: "Prime conversion period for family vacations and luxury group travel."
      weekend:
        target: 60.0
        floor: 55.0
        p75: 70.0
      midweek:
        target: 35.0
        floor: 30.0
        p75: 45.0
      action_guidance: "Target 55%–60% (Weekend) / 30%–35% (Midweek). Aligned with empirical comp conversion band and protected by $300 midweek floor."

    "≤30d":
      description: "Near-term and distress inventory liquidation window where unbooked nights risk perishable loss."
      weekend:
        target: 45.0
        floor: 40.0
        p75: 50.0
      midweek:
        target: 30.0
        floor: 25.0
        p75: 40.0
      action_guidance: "Aggressive liquidation: 40%–45% (Weekend) / 25%–30% (Midweek) to secure occupancy above $300 operational floor."

  anomaly_thresholds:
    urgent_percent_diff: 25.0  # UI filter: >25% diff between proposed and current rates -> "Urgent"
    moderate_percent_diff: 10.0 # UI filter: 10-25% diff between proposed and current rates -> "Review"
  proposed_pricing:
    comp_weight: 0.67          # Double weight for comp-derived price (target percentile)
    historical_weight: 0.33    # Single weight for historical benchmark price
    weekend_premium_factor: 1.50 # Allocation factor for mixed stays
    min_price_change_pct: 0.05 # 5% deadband threshold: hold current price if proposed change is < 5% to prevent PMS churn

market:
  location: "Tempe, AZ"
  target_radius_miles: 20
  target_drive_min: 30
  corridors:
    - "South Tempe"
    - "Chandler"
    - "Gilbert"
    - "Ahwatukee"
    - "Scottsdale / Old Town corridor"
    - "Arcadia / East Phoenix"
  comp_tiers:
    tier_a:
      description: "Direct luxury comps: 16+ guests, 6+ bedrooms, pool, resort amenities"
      min_guests: 16
      min_bedrooms: 6
    tier_b:
      description: "Secondary comps: 12-15 guests, 5+ bedrooms, pool, luxury compound"
      min_guests: 12
      min_bedrooms: 5
